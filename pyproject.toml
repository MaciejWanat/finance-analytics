[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-analytics"
dynamic = ["version"]
description = "Self-hosted, privacy-first analytics for personal savings and investments, valued in PLN."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "click>=8.1",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "plotly>=5.24",
    "psutil>=5.9",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "requests>=2.32",
    "streamlit>=1.40",
    "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "watchdog>=4.0",  # fast file watching for `fa ui --dev` auto-rerun
]

[project.scripts]
fa = "finance_analytics.cli:main"

[tool.setuptools.dynamic]
version = {attr = "finance_analytics.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The Streamlit UI ships inside the package (D-065). It is a folder of scripts, not a package,
# so its files are listed as data; tests/test_packaging.py checks that every file is covered.
finance_analytics = [
    "db/migrations/*.sql",
    "resources/*",
    "app/*.py",
    "app/ui/*.py",
    "app/views/*.py",
    "app/.streamlit/config.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
